[build]
target = "thumbv6m-none-eabi"

[target.thumbv6m-none-eabi]
rustflags = [
    "-C", "link-arg=--nmagic",
    "-C", "link-arg=-Tlink.x",
    "-C", "no-vectorize-loops",
]
# `cargo run --release` reboots a running board into BOOTSEL (via its serial
# port) if needed, then copies the firmware over.
runner = "scripts/flash.sh"
